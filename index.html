<title>YouTubeログイン中継</title>

<body>
<p>YouTube ログインページを開いています…</p>

<script>

  window.location.href = "main.html";
}, 3000);

// 5秒後にこのページを閉じる
setTimeout(() => {
  window.close();
}, 5000);
</script>
