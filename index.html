<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ようこそ - LILIUM配信ページ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    padding: 24px;
    font-family: system-ui, sans-serif;
    text-align: center;
    background: #ffffff;
    color: #222;
  }

  .logo {
    width: 240px;
    margin: 0 auto 24px;
  }

  h1 {
    font-size: 20px;
    margin-bottom: 16px;
  }

  .btn {
    display: block;
    width: 240px;
    margin: 12px auto;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 999px;
    border: none;
    cursor: pointer;
  }

  .btn-login {
    background: #ff4d4d;
    color: #fff;
  }

  .btn-start {
    background: #4d8dff;
    color: #fff;
  }
</style>
</head>
<body>

<!-- ロゴ画像 -->
<img src="logo.png" alt="LILIUMロゴ" class="logo">

<h1>Youtubeログインしてから開始ボタンを押してね！</h1>

<!-- YouTubeログインボタン -->
<button class="btn btn-login" id="btnLogin">
  YouTubeログイン
</button>

<!-- 開始ボタン -->
<button class="btn btn-start" onclick="location.href='main.html'">
  開始
</button>

<script>
  document.getElementById("btnLogin").addEventListener("click", () => {
    const youtubeURL = "https://www.youtube.com/live_chat?v=CfFqv5FfQFU";

    // 新規タブで開く（最も安定）
    window.open(youtubeURL, "_blank");
  });
</script>

</body>
</html>
