<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>A/B投票ページ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg-color: #ffffff;
      --border-color: #dddddd;
      --button-a: #ff4d4d;
      --button-b: #4d8dff;
      --button-disabled: #cccccc;
      --text-color: #222222;
    }

    * { box-sizing: border-box; }
    body { margin:0; padding:0; background: var(--bg-color); color: var(--text-color); font-family: system-ui, sans-serif; }
    .page { width:100%; padding:8px; }
    .layout { display:grid; grid-template-columns:2fr 1.2fr; gap:8px; }
    .video-wrapper, .chat-wrapper { border:1px solid var(--border-color); border-radius:8px; overflow:hidden; margin-bottom:8px; }
    .vote-area { border:1px solid var(--border-color); border-radius:8px; padding:8px; display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
    .vote-buttons { display:flex; gap:8px; }
    .vote-button { flex:1; padding:12px; border:none; border-radius:999px; color:#fff; font-weight:bold; cursor:pointer; }
    .vote-button-a { background:var(--button-a); }
    .vote-button-b { background:var(--button-b); }
    .vote-button.disabled { background:var(--button-disabled); cursor:default; }
    .vote-status { font-size:13px; min-height:1.2em; }
    .vote-status.voted { color:green; }
    .vote-status.error { color:red; }
    iframe { width:100%; height:100%; border:none; }
    img { width:100%; height:auto; display:block; }
  </style>
</head>

<body>
<div class="page">

  <!-- 動画 -->
  <div class="video-wrapper" id="videoWrapper">
    <iframe id="liveVideo" style="display:none;"></iframe>
    <img id="videoPlaceholder" src="waiting.png" />
  </div>

  <!-- 投票 -->
  <div class="vote-area">
    <div>どちらに投票しますか？</div>
    <div class="vote-buttons">
      <button id="voteA" class="vote-button vote-button-a">A に投票</button>
      <button id="voteB" class="vote-button vote-button-b">B に投票</button>
    </div>
    <div id="voteStatus" class="vote-status"></div>
  </div>

  <!-- チャット -->
  <div class="chat-wrapper" id="chatWrapper">
    <iframe id="liveChat" style="display:none;"></iframe>
    <img id="chatPlaceholder" src="chat_waiting.png" />
  </div>

  <!-- リロードボタン -->
  <div style="font-size:12px; margin-top:4px;">
    チャットが表示されない場合はログイン後リロードしてください。
    <button id="reloadAfterLogin">再表示</button>
  </div>

</div>

<script>
(function () {

  // ★ 更新済み GAS URL
  const API = "https://script.google.com/macros/s/AKfycbwqh4pdDAndUZQM2taDoBs_wV8D-zYrm6S7cJ8mWiUde0dE79rLm-lZKOImAZ6nz5IpRg/exec";

  const VOTE_KEY = "ab_vote_done";
  const USER_KEY = "ab_user_id";

  const voteAButton = document.getElementById("voteA");
  const voteBButton = document.getElementById("voteB");
  const voteStatus = document.getElementById("voteStatus");

  const liveVideo = document.getElementById("liveVideo");
  const liveChat = document.getElementById("liveChat");
  const videoPlaceholder = document.getElementById("videoPlaceholder");
  const chatPlaceholder = document.getElementById("chatPlaceholder");
  const reloadBtn = document.getElementById("reloadAfterLogin");

  let lastTotal = null;
  let lastVideoId = null;

  function getUserId() {
    let id = localStorage.getItem(USER_KEY);
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem(USER_KEY, id);
    }
    return id;
  }

  function setButtonsDisabled(disabled) {
    [voteAButton, voteBButton].forEach(btn => {
      btn.disabled = disabled;
      btn.classList.toggle("disabled", disabled);
    });
  }

  function resetUI() {
    setButtonsDisabled(false);
    voteStatus.textContent = "";
    voteStatus.className = "vote-status";
  }

  function setVotedUI(choice) {
    setButtonsDisabled(true);
    voteStatus.textContent = `「${choice}」に投票しました`;
    voteStatus.className = "vote-status voted";
  }

  function setErrorUI(msg) {
    voteStatus.textContent = msg;
    voteStatus.className = "vote-status error";
  }

  // ------------------------
  // 状態監視
  // ------------------------
  async function pollStatus() {
    try {
      const res = await fetch(API);
      const data = await res.json();

      const total = Number(data.a) + Number(data.b);

      // リセット判定：total=0 または resetFlag=true
      if (total === 0 || data.resetFlag) {
        localStorage.removeItem(VOTE_KEY);
        resetUI();
      }

      // 配信ID更新
      const videoId = data.latestVideoId || null;
      if (videoId !== lastVideoId) {
        lastVideoId = videoId;

        if (videoId) {
          liveVideo.src = `https://www.youtube.com/embed/${videoId}`;
          liveVideo.style.display = "block";
          videoPlaceholder.style.display = "none";

          liveChat.src = `https://www.youtube.com/live_chat?v=${videoId}&embed_domain=${location.hostname}`;
          liveChat.style.display = "block";
          chatPlaceholder.style.display = "none";
        } else {
          liveVideo.src = "";
          liveVideo.style.display = "none";
          videoPlaceholder.style.display = "block";

          liveChat.src = "";
          liveChat.style.display = "none";
          chatPlaceholder.style.display = "block";
        }
      }

      // lastTotal 保存＆減少チェック
      if (lastTotal === null) lastTotal = total;
      else if (total < lastTotal) {
        localStorage.removeItem(VOTE_KEY);
        resetUI();
        lastTotal = total;
      } else {
        lastTotal = total;
      }

    } catch (e) {
      console.error("poll error", e);
    }
  }

  // ------------------------
  // 投票送信
  // ------------------------
  async function sendVote(choice) {
    try {
      setButtonsDisabled(true);
      voteStatus.textContent = "送信中...";

      const res = await fetch(API, {
        method: "POST",
        body: JSON.stringify({
          choice,
          userId: getUserId()
        })
      });

      const data = await res.json();

      if (!data.ok) throw new Error(data.error || "失敗");

      localStorage.setItem(VOTE_KEY, choice);
      setVotedUI(choice);

    } catch (e) {
      console.error(e);
      setButtonsDisabled(false);
      setErrorUI("投票失敗：再試行してください");
    }
  }

  // ------------------------
  // イベント設定（安全）
  // ------------------------
  if (voteAButton) voteAButton.onclick = () => sendVote("A");
  if (voteBButton) voteBButton.onclick = () => sendVote("B");
  if (reloadBtn) reloadBtn.onclick = () => location.reload();

  // ------------------------
  // 初期化
  // ------------------------
  async function init() {
    await pollStatus(); // 即チェック

    const stored = localStorage.getItem(VOTE_KEY);
    if (stored) setVotedUI(stored);

    setInterval(pollStatus, 60000); // 60秒ごと
  }

  init();

})();
</script>
</body>
</html>
