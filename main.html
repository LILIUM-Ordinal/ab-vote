<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>A/B投票ページ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg-color: #ffffff;
      --border-color: #dddddd;
      --button-a: #ff4d4d;
      --button-b: #4d8dff;
      --button-disabled: #cccccc;
      --text-color: #222222;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page { width: 100%; padding: 8px; }

    @media (min-width: 1024px) {
      .layout {
        display: grid;
        grid-template-columns: 2fr 1.2fr;
        gap: 8px;
      }
      .right-column { display: flex; flex-direction: column; gap: 8px; }
      .video-wrapper { aspect-ratio: 16 / 9; border: 1px solid var(--border-color); }
      .chat-wrapper { flex: 1; border: 1px solid var(--border-color); overflow: hidden; }
    }

    @media (max-width: 1023px) {
      .layout { display: flex; flex-direction: column; gap: 8px; }
      .video-wrapper { aspect-ratio: 16 / 9; border: 1px solid var(--border-color); }
      .chat-wrapper { height: 400px; border: 1px solid var(--border-color); overflow: hidden; }
    }

    .vote-area {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .vote-buttons { display: flex; gap: 8px; }

    .vote-button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 999px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    .vote-button-a { background: var(--button-a); }
    .vote-button-b { background: var(--button-b); }
    .vote-button.disabled { background: var(--button-disabled); cursor: default; }

    .vote-status { font-size: 13px; min-height: 1.2em; }
    .vote-status.voted { color: green; }
    .vote-status.error { color: red; }

    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>

<body>
<div class="page">
  <div class="layout">

    <div>
      <div class="video-wrapper">
        <iframe src="https://www.youtube.com/embed/CfFqv5FfQFU" allowfullscreen></iframe>
      </div>
    </div>

    <div class="right-column">

      <div class="vote-area">
        <div>どちらに投票しますか？</div>
        <div class="vote-buttons">
          <button id="voteA" class="vote-button vote-button-a">A に投票</button>
          <button id="voteB" class="vote-button vote-button-b">B に投票</button>
        </div>
        <div id="voteStatus" class="vote-status"></div>
      </div>

      <div class="chat-wrapper">
        <iframe src="https://www.youtube.com/live_chat?v=CfFqv5FfQFU&embed_domain=lilium-ordinal.github.io"></iframe>
      </div>

      <div style="font-size:12px;">
        チャットが表示されない場合はログイン後リロードしてください。
        <button id="reloadAfterLogin">再表示</button>
      </div>

    </div>
  </div>
</div>

<script>
(function () {

  const API = "https://script.google.com/macros/s/AKfycbwqh4pdDAndUZQM2taDoBs_wV8D-zYrm6S7cJ8mWiUde0dE79rLm-lZKOImAZ6nz5IpRg/exec";
  const VOTE_KEY = "ab_vote_done";
  const USER_KEY = "ab_user_id";

  const voteAButton = document.getElementById("voteA");
  const voteBButton = document.getElementById("voteB");
  const voteStatus = document.getElementById("voteStatus");

  function getUserId() {
    let id = localStorage.getItem(USER_KEY);
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem(USER_KEY, id);
    }
    return id;
  }

  function setButtonsDisabled(disabled) {
    [voteAButton, voteBButton].forEach(btn => {
      btn.disabled = disabled;
      btn.classList.toggle("disabled", disabled);
    });
  }

  function setVotedUI(choice) {
    setButtonsDisabled(true);
    voteStatus.textContent = `「${choice}」に投票しました`;
    voteStatus.className = "vote-status voted";
  }

  function setErrorUI(msg) {
    voteStatus.textContent = msg;
    voteStatus.className = "vote-status error";
  }

  // 既に投票済み
  const stored = localStorage.getItem(VOTE_KEY);
  if (stored) setVotedUI(stored);

  async function sendVote(choice) {
    try {
      setButtonsDisabled(true);
      voteStatus.textContent = "送信中...";

      const res = await fetch(API, {
        method: "POST",
        // ★CORS回避：headers消してる
        body: JSON.stringify({
          choice,
          userId: getUserId()
        })
      });

      const data = await res.json();

      if (!data.ok) {
        throw new Error(data.error || "失敗");
      }

      localStorage.setItem(VOTE_KEY, choice);
      setVotedUI(choice);

    } catch (e) {
      console.error(e);
      setButtonsDisabled(false);
      setErrorUI("投票失敗：再試行してください");
    }
  }

  voteAButton.onclick = () => sendVote("A");
  voteBButton.onclick = () => sendVote("B");

  document.getElementById("reloadAfterLogin").onclick = () => location.reload();

})();
</script>
</body>
</html>
