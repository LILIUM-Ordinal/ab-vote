<script>
(function () {

  const API = "https://script.google.com/macros/s/AKfycbwqh4pdDAndUZQM2taDoBs_wV8D-zYrm6S7cJ8mWiUde0dE79rLm-lZKOImAZ6nz5IpRg/exec";
  const VOTE_KEY = "ab_vote_done";
  const USER_KEY = "ab_user_id";

  const voteAButton = document.getElementById("voteA");
  const voteBButton = document.getElementById("voteB");
  const voteStatus = document.getElementById("voteStatus");

  const liveVideo = document.getElementById("liveVideo");
  const liveChat = document.getElementById("liveChat");
  const videoPlaceholder = document.getElementById("videoPlaceholder");
  const chatPlaceholder = document.getElementById("chatPlaceholder");

  let lastTotal = null;
  let lastVideoId = null;

  function getUserId() {
    let id = localStorage.getItem(USER_KEY);
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem(USER_KEY, id);
    }
    return id;
  }

  function setButtonsDisabled(disabled) {
    [voteAButton, voteBButton].forEach(btn => {
      btn.disabled = disabled;
      btn.classList.toggle("disabled", disabled);
    });
  }

  function resetUI() {
    setButtonsDisabled(false);
    voteStatus.textContent = "";
    voteStatus.className = "vote-status";
  }

  function setVotedUI(choice) {
    setButtonsDisabled(true);
    voteStatus.textContent = `「${choice}」に投票しました`;
    voteStatus.className = "vote-status voted";
  }

  function setErrorUI(msg) {
    voteStatus.textContent = msg;
    voteStatus.className = "vote-status error";
  }

  // ------------------------
  // 配信ID + 投票状態監視
  // ------------------------
  async function pollStatus() {
    try {
      const res = await fetch(API);
      const data = await res.json();

      // ------------------------
      // 投票リセット検知
      // ------------------------
      const total = Number(data.a) + Number(data.b);
      if (lastTotal !== null && total < lastTotal) {
        localStorage.removeItem(VOTE_KEY);
        resetUI();
      }
      lastTotal = total;

      // ------------------------
      // 配信ID更新
      // ------------------------
      const videoId = data.latestVideoId || null;
      if (videoId !== lastVideoId) {
        lastVideoId = videoId;

        if (videoId) {
          // 配信中
          liveVideo.src = `https://www.youtube.com/embed/${videoId}`;
          liveVideo.style.display = "block";
          videoPlaceholder.style.display = "none";

          liveChat.src = `https://www.youtube.com/live_chat?v=${videoId}&embed_domain=${location.hostname}`;
          liveChat.style.display = "block";
          chatPlaceholder.style.display = "none";
        } else {
          // 配信未開始
          liveVideo.src = "";
          liveVideo.style.display = "none";
          videoPlaceholder.style.display = "block";

          liveChat.src = "";
          liveChat.style.display = "none";
          chatPlaceholder.style.display = "block";
        }
      }

    } catch (e) {
      console.error("poll error", e);
    }
  }

  // ------------------------
  // 投票送信
  // ------------------------
  async function sendVote(choice) {
    try {
      setButtonsDisabled(true);
      voteStatus.textContent = "送信中...";

      const res = await fetch(API, {
        method: "POST",
        body: JSON.stringify({
          choice,
          userId: getUserId()
        })
      });

      const data = await res.json();

      if (!data.ok) {
        throw new Error(data.error || "失敗");
      }

      localStorage.setItem(VOTE_KEY, choice);
      setVotedUI(choice);

    } catch (e) {
      console.error(e);
      setButtonsDisabled(false);
      setErrorUI("投票失敗：再試行してください");
    }
  }

  voteAButton.onclick = () => sendVote("A");
  voteBButton.onclick = () => sendVote("B");

  document.getElementById("reloadAfterLogin").onclick = () => location.reload();

  // ------------------------
  // 初期化
  // ------------------------
  async function init() {
    // 即チェック
    await pollStatus();

    // 投票状態反映
    const stored = localStorage.getItem(VOTE_KEY);
    if (stored) setVotedUI(stored);

    // 60秒ごとに監視
    setInterval(pollStatus, 60000);
  }

  init();

})();
</script>
